[package]
name = "usage-monitor"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
# Pinned to the npm @tauri-apps/plugin-http minor (tauri dev refuses mismatches).
# unsafe-headers: lets a request drop the webview's Origin header (Anthropic rejects "CORS" requests).
tauri-plugin-http = { version = "~2.6", features = ["unsafe-headers"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local Antigravity probe (self-signed localhost certificate).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Reads auth state from VS Code forks' state.vscdb.
rusqlite = { version = "0.37", features = ["bundled"] }
# Finds Antigravity's OAuth client in its installed files.
regex = "1"
tauri-plugin-updater = "2.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
